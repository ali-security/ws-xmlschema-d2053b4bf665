name: Continuous Integration

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional surefire -Dtest selector; empty runs the full suite'
        required: false
        default: ''

env:
  MAVEN_OPTS: -Dmaven.wagon.httpconnectionManager.ttlSeconds=25 -Dmaven.wagon.http.retryHandler.count=3

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        java: [ 8, 11, 17, 20 ]
    name: "Java ${{ matrix.java }}"
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Cache Maven Repository
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: maven-java-${{ matrix.java }}-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          maven-java-${{ matrix.java }}-
          maven-
    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: ${{ matrix.java }}
    - name: Build
      run: |
        if [ -n "${{ inputs.test-filter }}" ]; then
          mvn -B -e -Prelease -Dgpg.skip=true verify -Dtest="${{ inputs.test-filter }}" -DfailIfNoTests=false
        else
          mvn -B -e -Prelease -Dgpg.skip=true verify
        fi
    - name: Upload xmlschema-core jar
      if: matrix.java == 8
      uses: actions/upload-artifact@v4
      with:
        name: xmlschema-core-jar
        path: xmlschema-core/target/xmlschema-core-2.3.1.jar
        if-no-files-found: error
    - name: Remove Snapshots
      run: find ~/.m2/repository -name '*-SNAPSHOT' -a -type d -print0 | xargs -0 rm -rf
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.repository == 'apache/ws-xmlschema'
    name: Deploy
    runs-on: ubuntu-22.04
    needs: build
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Cache Maven Repository
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: maven-deploy-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          maven-deploy-
          maven-
    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: 8
        server-id: apache.snapshots.https
        server-username: NEXUS_USER
        server-password: NEXUS_PW
    - name: Deploy
      run: mvn -B -e -Prelease -Dgpg.skip=true -DskipTests=true deploy
      env:
        NEXUS_USER: ${{ secrets.NEXUS_USER }}
        NEXUS_PW: ${{ secrets.NEXUS_PW }}
    - name: Remove Snapshots
      run: find ~/.m2/repository -name '*-SNAPSHOT' -a -type d -print0 | xargs -0 rm -rf
